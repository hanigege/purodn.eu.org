<!doctype html><html lang=zh-cn><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>搜索 | Jay's Blog</title>
<meta name=description content="搜索站内教程文章。"><link rel=icon href=/favicon/favicon.ico sizes=32x32><link rel=icon type=image/svg+xml href=/favicon/favicon.svg><link rel=apple-touch-icon href=/favicon/apple-touch-icon.png><meta name=theme-color content="#222831"><link rel=stylesheet href=/css/main.min.12ee78fb1fccf03c733d566860526f0fba1ad132ed25b583205ee18c303368dc.css integrity="sha256-Eu54+x/M8DxzPVZoYFJvD7oa0TLtJbWDIF7hjDAzaNw="></head><body><header class=site-header><div class=header-inner><a class=brand href=/ aria-label="Jay's Blog 首页"><img class=brand-sign src=/images/jays-blog-brand.png alt="Jay's Blog"></a><form class=header-search action=/search/ method=get role=search><input id=header-search name=q type=search placeholder=搜索教程... autocomplete=off aria-label=站内搜索>
<button type=submit>搜索</button></form><nav class=site-nav aria-label=主导航><a href=/>首页</a>

<a href=/categories/docker/>Docker</a></nav></div></header><main><section class=search-page><header class=archive-header><p>搜索</p><h1>站内搜索</h1><span>输入关键词，搜索文章标题与正文。</span></header><form class=search-page-form action=/search/ method=get id=search-form><input id=search-input name=q type=search placeholder="搜索 Router、Linux、Docker..." autocomplete=off autofocus>
<button type=submit>搜索</button></form><p class=search-status id=search-status>请输入关键词开始搜索。</p><div class="search-results card-feed" id=search-results></div></section><script type=module>
    const form = document.getElementById("search-form");
    const input = document.getElementById("search-input");
    const status = document.getElementById("search-status");
    const results = document.getElementById("search-results");
    const params = new URLSearchParams(window.location.search);
    const initialQuery = (params.get("q") || "").trim();
    input.value = initialQuery;

    let pagefind = null;
    let loadFailed = false;

    async function ensureLoaded() {
      if (pagefind || loadFailed) {
        return;
      }
      try {
        pagefind = await import("/pagefind/pagefind.js");
        await pagefind.init();
      } catch (error) {
        loadFailed = true;
      }
    }

    function buildCard(data) {
      const card = document.createElement("article");
      card.className = "post-card";

      const thumb = document.createElement("a");
      thumb.className = "post-thumb";
      thumb.href = data.url;
      thumb.setAttribute("aria-label", data.meta.title || "");
      const img = document.createElement("img");
      img.src = data.meta.image || "/images/computer-tutorial-hero.png";
      img.alt = "";
      thumb.appendChild(img);
      card.appendChild(thumb);

      const body = document.createElement("div");
      body.className = "post-body";

      const heading = document.createElement("h2");
      const link = document.createElement("a");
      link.href = data.url;
      link.textContent = data.meta.title || data.url;
      heading.appendChild(link);
      body.appendChild(heading);

      const meta = document.createElement("div");
      meta.className = "post-meta";
      const category = document.createElement("span");
      category.textContent = data.meta.category || "文章";
      meta.appendChild(category);
      if (data.meta.date) {
        const time = document.createElement("time");
        time.textContent = data.meta.date;
        meta.appendChild(time);
      }
      body.appendChild(meta);

      if (data.excerpt) {
        const excerpt = document.createElement("p");
        excerpt.className = "search-excerpt";
        excerpt.innerHTML = data.excerpt;
        body.appendChild(excerpt);
      }

      card.appendChild(body);
      return card;
    }

    let runToken = 0;
    async function runSearch(query) {
      const token = ++runToken;
      query = (query || "").trim();
      results.innerHTML = "";
      if (!query) {
        status.textContent = "请输入关键词开始搜索。";
        return;
      }
      status.textContent = "正在搜索…";
      await ensureLoaded();
      if (token !== runToken) {
        return;
      }
      if (loadFailed || !pagefind) {
        status.textContent = "搜索索引加载失败，请稍后刷新重试。";
        return;
      }
      const search = await pagefind.search(query);
      if (token !== runToken) {
        return;
      }
      if (!search.results.length) {
        status.textContent = "没有找到与“" + query + "”相关的文章。";
        return;
      }
      status.textContent = "找到 " + search.results.length + " 篇与“" + query + "”相关的文章。";
      const all = search.results.slice(0, 50);
      const FIRST_BATCH = 12;
      const firstData = await Promise.all(all.slice(0, FIRST_BATCH).map(function (r) { return r.data(); }));
      if (token !== runToken) {
        return;
      }
      const fragment = document.createDocumentFragment();
      for (const data of firstData) {
        fragment.appendChild(buildCard(data));
      }
      results.appendChild(fragment);
      if (all.length > FIRST_BATCH) {
        const restData = await Promise.all(all.slice(FIRST_BATCH).map(function (r) { return r.data(); }));
        if (token !== runToken) {
          return;
        }
        const rest = document.createDocumentFragment();
        for (const data of restData) {
          rest.appendChild(buildCard(data));
        }
        results.appendChild(rest);
      }
    }

    let debounce = null;
    input.addEventListener("input", function () {
      window.clearTimeout(debounce);
      debounce = window.setTimeout(function () {
        const query = input.value.trim();
        const url = new URL(window.location.href);
        if (query) {
          url.searchParams.set("q", query);
        } else {
          url.searchParams.delete("q");
        }
        window.history.replaceState(null, "", url);
        runSearch(query);
      }, 250);
    });

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      runSearch(input.value);
    });

    ensureLoaded();
    if (initialQuery) {
      runSearch(initialQuery);
    }
  </script></main><footer class=site-footer><p>© 2026 Jay's Blog.
专注清晰、可复现、少踩坑的电脑教程。</p></footer><script src=/js/code-copy.min.3c4506b5a479421e1f2dd29702a729f3d3ea05a9b1a77b9d6a2ffe9f83882ca2.js integrity="sha256-PEUGtaR5Qh4fLdKXAqcp89PqBamxp3udai/+n4OILKI=" defer></script></body></html>
