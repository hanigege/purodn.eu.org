<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">双网口 RouterOS 完整恢复</title>
  <desc id="desc">双网口 RouterOS 连接 WAN、LAN 与 sing-box 网关，展示 IPv4 和 IPv6 双栈配置。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071b32"/><stop offset="1" stop-color="#123e52"/></linearGradient>
    <linearGradient id="router" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#177a83"/><stop offset="1" stop-color="#13a28f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity=".42"/></filter>
  </defs>
  <rect width="1200" height="630" rx="32" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="180" fill="#22d3ee" opacity=".08"/><circle cx="160" cy="560" r="210" fill="#34d399" opacity=".07"/>
  <g fill="none" stroke="#5eead4" stroke-width="5" stroke-linecap="round" opacity=".8"><path d="M245 315H420"/><path d="M780 315H955"/><path d="M600 410V500"/></g>
  <g fill="#a7f3d0"><circle cx="245" cy="315" r="8"/><circle cx="955" cy="315" r="8"/><circle cx="600" cy="500" r="8"/></g>
  <g filter="url(#shadow)"><rect x="420" y="205" width="360" height="210" rx="28" fill="url(#router)" stroke="#99f6e4" stroke-opacity=".55" stroke-width="2"/><rect x="458" y="244" width="284" height="104" rx="16" fill="#0b2438" opacity=".86"/><g fill="#5eead4"><rect x="480" y="270" width="58" height="40" rx="7"/><rect x="551" y="270" width="58" height="40" rx="7"/><rect x="622" y="270" width="58" height="40" rx="7"/><rect x="693" y="270" width="28" height="40" rx="7"/></g><g fill="#d1fae5" opacity=".9"><circle cx="482" cy="376" r="5"/><circle cx="504" cy="376" r="5"/><circle cx="526" cy="376" r="5"/></g></g>
  <g font-family="Inter, 'Noto Sans SC', Arial, sans-serif" text-anchor="middle">
    <text x="600" y="144" fill="#f8fafc" font-size="46" font-weight="800">双网口 RouterOS</text>
    <text x="600" y="181" fill="#a7f3d0" font-size="21" font-weight="600">恢复教程 · IPv4 / IPv6 · sing-box</text>
    <text x="165" y="285" fill="#e2e8f0" font-size="26" font-weight="700">WAN</text><text x="165" y="330" fill="#94a3b8" font-size="18">动态上联</text>
    <text x="1035" y="285" fill="#e2e8f0" font-size="26" font-weight="700">LAN</text><text x="1035" y="330" fill="#94a3b8" font-size="18">10.0.0.0/24</text>
    <text x="600" y="470" fill="#e2e8f0" font-size="22" font-weight="700">sing-box 网关</text><text x="600" y="536" fill="#a7f3d0" font-size="18">10.0.0.6 · fd88:1::6</text>
    <text x="600" y="590" fill="#94a3b8" font-size="16">网口 → DHCP → 策略路由 → 双栈防火墙</text>
  </g>
</svg>

