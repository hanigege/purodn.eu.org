<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">tssh tsshd SOCKS5 Hysteria2 tmux</title>
  <desc id="desc">A secure terminal connection flows from a Mac through a SOCKS5 and Hysteria2 relay to tsshd and tmux.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#1c3140"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#68d6c0"/>
      <stop offset="1" stop-color="#ffc46b"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1350" cy="90" r="270" fill="#284a55" opacity=".35"/>
  <circle cx="180" cy="790" r="230" fill="#173b4a" opacity=".42"/>
  <path d="M130 640 C390 460 490 470 690 570 S1050 670 1450 390" fill="none" stroke="#365466" stroke-width="3" stroke-dasharray="12 18"/>
  <path d="M250 560 C500 430 650 465 805 560 S1090 610 1330 430" fill="none" stroke="url(#line)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" fill="#f4f8f7">
    <text x="120" y="135" font-size="30" fill="#8ce5d0" letter-spacing="5">LINUX NETWORKING GUIDE</text>
    <text x="120" y="235" font-size="70" font-weight="700">tssh + tsshd</text>
    <text x="120" y="315" font-size="42" fill="#c9d9dc">SOCKS5 / Hysteria2 / tmux</text>
    <text x="120" y="385" font-size="26" fill="#9eb5bb">让被 TCP 阻断的 SSH 重新连上</text>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">
    <g transform="translate(170 545)">
      <rect width="180" height="120" rx="18" fill="#172735" stroke="#68d6c0" stroke-width="3"/>
      <text x="90" y="52" fill="#fff" font-size="28">Mac</text>
      <text x="90" y="88" fill="#8ce5d0" font-size="18">tssh</text>
    </g>
    <g transform="translate(510 500)">
      <rect width="220" height="150" rx="18" fill="#172735" stroke="#68d6c0" stroke-width="3"/>
      <text x="110" y="55" fill="#fff" font-size="25">SOCKS5</text>
      <text x="110" y="92" fill="#8ce5d0" font-size="18">sing-box</text>
      <text x="110" y="122" fill="#a6bdc3" font-size="16">LAN proxy</text>
    </g>
    <g transform="translate(890 505)">
      <rect width="210" height="140" rx="18" fill="#172735" stroke="#ffc46b" stroke-width="3"/>
      <text x="105" y="56" fill="#fff" font-size="27">Hysteria2</text>
      <text x="105" y="98" fill="#ffc46b" font-size="18">proxy path</text>
    </g>
    <g transform="translate(1260 360)">
      <rect width="220" height="160" rx="18" fill="#172735" stroke="#ffc46b" stroke-width="3"/>
      <text x="110" y="58" fill="#fff" font-size="27">tsshd</text>
      <text x="110" y="98" fill="#ffc46b" font-size="18">port 61001</text>
      <text x="110" y="130" fill="#a6bdc3" font-size="17">tmux session</text>
    </g>
  </g>
  <text x="120" y="820" fill="#7fa2aa" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22">ProxyCommand → tsshd → tmux -u new-session -A -s jay</text>
</svg>
