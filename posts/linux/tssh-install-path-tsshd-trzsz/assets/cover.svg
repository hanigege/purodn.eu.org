<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="tssh 指定安装路径：trzsz 与 tsshd 装到用户目录还是 /usr/local/bin（Alpine 实测）">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="220" fill="#38bdf8" opacity="0.07"/>
  <circle cx="120" cy="540" r="180" fill="#34d399" opacity="0.06"/>

  <!-- Title -->
  <text x="600" y="84" text-anchor="middle" font-family="'SF Mono','JetBrains Mono','Menlo',monospace" font-size="44" font-weight="700" fill="#f8fafc">tssh 指定安装路径</text>
  <text x="600" y="128" text-anchor="middle" font-family="'SF Mono','JetBrains Mono','Menlo',monospace" font-size="24" fill="#94a3b8">trzsz / tsshd 装给普通用户，还是装进 /usr/local/bin</text>

  <!-- Left terminal: commands -->
  <rect x="90" y="170" width="480" height="360" rx="14" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <rect x="90" y="170" width="480" height="42" rx="14" fill="#1e293b"/>
  <rect x="90" y="196" width="480" height="16" fill="#1e293b"/>
  <circle cx="116" cy="191" r="7" fill="#f87171"/>
  <circle cx="140" cy="191" r="7" fill="#fbbf24"/>
  <circle cx="164" cy="191" r="7" fill="#34d399"/>
  <text x="330" y="196" text-anchor="middle" font-family="'SF Mono',monospace" font-size="16" fill="#64748b">客户端：你敲的命令</text>

  <text x="112" y="242" font-family="'SF Mono','JetBrains Mono',monospace" font-size="15" fill="#38bdf8">$ tssh --install-path '~/.local/bin' \</text>
  <text x="112" y="266" font-family="'SF Mono','JetBrains Mono',monospace" font-size="15" fill="#38bdf8">    --install-trzsz us685</text>
  <text x="112" y="290" font-family="'SF Mono','JetBrains Mono',monospace" font-size="14" fill="#34d399">→ 普通用户，不需要 root</text>

  <text x="112" y="330" font-family="'SF Mono','JetBrains Mono',monospace" font-size="15" fill="#f87171">$ tssh --install-path /usr/local/bin ...</text>
  <text x="112" y="354" font-family="'SF Mono','JetBrains Mono',monospace" font-size="14" fill="#f87171">→ scp: Permission denied</text>

  <text x="112" y="394" font-family="'SF Mono','JetBrains Mono',monospace" font-size="15" fill="#fbbf24">$ tssh --install-path '~/tmp' ...</text>
  <text x="112" y="418" font-family="'SF Mono','JetBrains Mono',monospace" font-size="15" fill="#fbbf24">$ doas mv ~/tmp/* /usr/local/bin/</text>
  <text x="112" y="442" font-family="'SF Mono','JetBrains Mono',monospace" font-size="14" fill="#34d399">→ 两段式，才是系统级正解</text>

  <text x="112" y="482" font-family="'SF Mono','JetBrains Mono',monospace" font-size="15" fill="#64748b">Alias us685 → Alpine 3.23.4 / x86_64</text>

  <!-- Arrow between -->
  <text x="600" y="380" text-anchor="middle" font-family="'SF Mono',monospace" font-size="40" fill="#38bdf8">⇄</text>

  <!-- Right terminal: install output -->
  <rect x="630" y="170" width="480" height="360" rx="14" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <rect x="630" y="170" width="480" height="42" rx="14" fill="#1e293b"/>
  <rect x="630" y="196" width="480" height="16" fill="#1e293b"/>
  <circle cx="656" cy="191" r="7" fill="#f87171"/>
  <circle cx="680" cy="191" r="7" fill="#fbbf24"/>
  <circle cx="704" cy="191" r="7" fill="#34d399"/>
  <text x="870" y="196" text-anchor="middle" font-family="'SF Mono',monospace" font-size="16" fill="#64748b">服务器：真实的输出</text>

  <text x="654" y="240" font-family="'SF Mono','JetBrains Mono',monospace" font-size="13" fill="#34d399">[InstallTrzsz] trzsz 1.2.0 installation to</text>
  <text x="666" y="262" font-family="'SF Mono','JetBrains Mono',monospace" font-size="13" fill="#f8fafc">/home/jay/.local/bin completed successfully</text>

  <text x="654" y="296" font-family="'SF Mono','JetBrains Mono',monospace" font-size="13" fill="#fbbf24">[InstallTrzsz] you may need to add</text>
  <text x="666" y="318" font-family="'SF Mono','JetBrains Mono',monospace" font-size="13" fill="#fbbf24">/home/jay/.local/bin to the PATH ...</text>

  <text x="654" y="352" font-family="'SF Mono','JetBrains Mono',monospace" font-size="13" fill="#34d399">[InstallTsshd] tsshd 0.1.10 installation</text>
  <text x="666" y="374" font-family="'SF Mono','JetBrains Mono',monospace" font-size="13" fill="#f8fafc">to /home/jay/.local/bin completed</text>

  <text x="654" y="408" font-family="'SF Mono','JetBrains Mono',monospace" font-size="13" fill="#64748b">[InstallTsshd] you may need to specify</text>
  <text x="666" y="430" font-family="'SF Mono','JetBrains Mono',monospace" font-size="13" fill="#64748b">'TsshdPath ...' in ~/.ssh/config</text>

  <!-- badges -->
  <rect x="654" y="456" width="150" height="34" rx="8" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
  <text x="729" y="478" text-anchor="middle" font-family="'SF Mono',monospace" font-size="15" fill="#34d399">静态二进制</text>
  <rect x="818" y="456" width="196" height="34" rx="8" fill="#0b1220" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="916" y="478" text-anchor="middle" font-family="'SF Mono',monospace" font-size="15" fill="#38bdf8">无需 gcompat</text>

  <!-- Footer -->
  <rect x="90" y="566" width="1020" height="2" fill="#334155"/>
  <text x="600" y="600" text-anchor="middle" font-family="'SF Mono','JetBrains Mono',monospace" font-size="18" fill="#34d399">实测：tssh 0.1.26 · trzsz 1.2.0 · tsshd 0.1.10 · Alpine 3.23.4</text>
</svg>
