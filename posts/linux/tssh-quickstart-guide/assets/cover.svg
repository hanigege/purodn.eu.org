<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="tssh 小白实操：安装、添加站点、tmux 批量登录、密码/证书/UDP 登录">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="220" fill="#38bdf8" opacity="0.07"/>
  <circle cx="120" cy="540" r="180" fill="#34d399" opacity="0.06"/>

  <!-- Title -->
  <text x="600" y="84" text-anchor="middle" font-family="'SF Mono','JetBrains Mono','Menlo',monospace" font-size="44" font-weight="700" fill="#f8fafc">tssh 小白实操</text>
  <text x="600" y="128" text-anchor="middle" font-family="'SF Mono','JetBrains Mono','Menlo',monospace" font-size="24" fill="#94a3b8">安装 · 添加站点 · tmux 批量 · 密码 / 证书 / UDP 登录</text>

  <!-- Left terminal: tssh host list -->
  <rect x="90" y="170" width="480" height="360" rx="14" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <rect x="90" y="170" width="480" height="42" rx="14" fill="#1e293b"/>
  <rect x="90" y="196" width="480" height="16" fill="#1e293b"/>
  <circle cx="116" cy="191" r="7" fill="#f87171"/>
  <circle cx="140" cy="191" r="7" fill="#fbbf24"/>
  <circle cx="164" cy="191" r="7" fill="#34d399"/>
  <text x="330" y="196" text-anchor="middle" font-family="'SF Mono',monospace" font-size="16" fill="#64748b">tssh — 服务器列表</text>

  <text x="112" y="244" font-family="'SF Mono','JetBrains Mono',monospace" font-size="18" fill="#38bdf8">$ tssh</text>
  <text x="112" y="278" font-family="'SF Mono','JetBrains Mono',monospace" font-size="16" fill="#64748b">? SSH Alias:</text>
  <text x="112" y="308" font-family="'SF Mono','JetBrains Mono',monospace" font-size="16" fill="#34d399">🧨 myvps (203.0.113.10)</text>
  <text x="112" y="336" font-family="'SF Mono','JetBrains Mono',monospace" font-size="16" fill="#94a3b8">   web1  (203.0.113.20)</text>
  <text x="112" y="364" font-family="'SF Mono','JetBrains Mono',monospace" font-size="16" fill="#94a3b8">   web2  (203.0.113.21)</text>
  <text x="112" y="408" font-family="'SF Mono','JetBrains Mono',monospace" font-size="16" fill="#64748b">Alias: myvps  Host: 203.0.113.10</text>
  <text x="112" y="432" font-family="'SF Mono','JetBrains Mono',monospace" font-size="16" fill="#64748b">Port:  22     User: root</text>
  <text x="112" y="470" font-family="'SF Mono','JetBrains Mono',monospace" font-size="16" fill="#fbbf24">/ 搜索  回车登录</text>

  <!-- Arrow between -->
  <text x="600" y="380" text-anchor="middle" font-family="'SF Mono',monospace" font-size="40" fill="#38bdf8">⇄</text>

  <!-- Right terminal: tmux split -->
  <rect x="630" y="170" width="480" height="360" rx="14" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <rect x="630" y="170" width="480" height="42" rx="14" fill="#1e293b"/>
  <rect x="630" y="196" width="480" height="16" fill="#1e293b"/>
  <circle cx="656" cy="191" r="7" fill="#f87171"/>
  <circle cx="680" cy="191" r="7" fill="#fbbf24"/>
  <circle cx="704" cy="191" r="7" fill="#34d399"/>
  <text x="870" y="196" text-anchor="middle" font-family="'SF Mono',monospace" font-size="16" fill="#64748b">tmux + tssh 批量登录</text>

  <!-- tmux status bar -->
  <rect x="654" y="236" width="432" height="26" rx="6" fill="#1e293b"/>
  <text x="666" y="254" font-family="'SF Mono',monospace" font-size="13" fill="#38bdf8">myvps</text>
  <text x="730" y="254" font-family="'SF Mono',monospace" font-size="13" fill="#64748b">web1</text>
  <text x="790" y="254" font-family="'SF Mono',monospace" font-size="13" fill="#64748b">web2</text>

  <text x="654" y="300" font-family="'SF Mono','JetBrains Mono',monospace" font-size="17" fill="#38bdf8">$ tmux</text>
  <text x="654" y="330" font-family="'SF Mono','JetBrains Mono',monospace" font-size="17" fill="#38bdf8">$ tssh</text>
  <text x="654" y="364" font-family="'SF Mono','JetBrains Mono',monospace" font-size="16" fill="#34d399">Space 多选 → Ctrl+P 分屏</text>
  <text x="654" y="398" font-family="'SF Mono','JetBrains Mono',monospace" font-size="16" fill="#fbbf24">root@myvps:~# uptime</text>
  <text x="654" y="426" font-family="'SF Mono','JetBrains Mono',monospace" font-size="16" fill="#64748b">web1:  load 0.10  web2:  load 0.05</text>

  <!-- UDP badge -->
  <rect x="654" y="452" width="180" height="34" rx="8" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
  <text x="744" y="474" text-anchor="middle" font-family="'SF Mono',monospace" font-size="16" fill="#34d399">UDP 弱网不掉线</text>

  <!-- Footer -->
  <rect x="90" y="566" width="1020" height="2" fill="#334155"/>
  <text x="600" y="600" text-anchor="middle" font-family="'SF Mono','JetBrains Mono',monospace" font-size="18" fill="#34d399">Ubuntu / Debian / macOS / Alpine 全平台安装指南</text>
</svg>
